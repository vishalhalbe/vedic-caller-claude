name: 🏷️ CosmicSage Release

on:
  push:
    tags:
      - 'v*.*.*'           # Semantic version tags: v1.0.0, v2.3.1
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.3)'
        required: true
      release-type:
        description: 'Release type'
        required: true
        type: choice
        options: [major, minor, patch, hotfix]
      release-notes:
        description: 'Release notes (markdown)'
        required: false

jobs:
  # ──────────────────────────────────────────────────────
  # STEP 1: Validate Version
  # ──────────────────────────────────────────────────────
  validate:
    name: ✅ Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          # Validate semver format
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Valid version: $VERSION"

  # ──────────────────────────────────────────────────────
  # STEP 2: Full Test Suite
  # ──────────────────────────────────────────────────────
  test:
    name: 🧪 Release Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20.x', cache: 'npm' }
      - run: npm ci
      - run: npm test -- --coverage --reporter=verbose
        env:
          VITE_AGORA_APP_ID: ${{ secrets.AGORA_APP_ID_TEST }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_TEST }}

  # ──────────────────────────────────────────────────────
  # STEP 3: Build Release Bundle
  # ──────────────────────────────────────────────────────
  build-release:
    name: 📦 Build Release ${{ needs.validate.outputs.version }}
    runs-on: ubuntu-latest
    needs: [validate, test]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20.x', cache: 'npm' }
      - run: npm ci

      - name: Update version in package.json
        run: |
          npm version ${{ needs.validate.outputs.version }} --no-git-tag-version
          cat package.json | grep '"version"'

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production
          VITE_AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL }}
          VITE_ENVIRONMENT: production

      - name: Create release archive
        run: |
          tar -czf cosmicsage-${{ needs.validate.outputs.version }}.tar.gz dist/
          sha256sum cosmicsage-${{ needs.validate.outputs.version }}.tar.gz > cosmicsage-${{ needs.validate.outputs.version }}.sha256
          echo "Archive size: $(du -sh cosmicsage-${{ needs.validate.outputs.version }}.tar.gz | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.validate.outputs.version }}
          path: |
            dist/
            cosmicsage-${{ needs.validate.outputs.version }}.tar.gz
            cosmicsage-${{ needs.validate.outputs.version }}.sha256

  # ──────────────────────────────────────────────────────
  # STEP 4: Generate Changelog
  # ──────────────────────────────────────────────────────
  changelog:
    name: 📝 Generate Changelog
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Generate changelog from commits
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --format="- %s (%h)" | head -20)
          else
            COMMITS=$(git log --oneline --format="- %s (%h)" $PREV_TAG..HEAD)
          fi

          CHANGELOG="### What's Changed\n\n$COMMITS"
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────────────
  # STEP 5: Create GitHub Release
  # ──────────────────────────────────────────────────────
  release:
    name: 🏷️ Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build-release, changelog]

    steps:
      - uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.validate.outputs.version }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: CosmicSage ${{ needs.validate.outputs.tag }}
          draft: false
          prerelease: ${{ github.event.inputs.release-type == 'hotfix' }}
          body: |
            # 🌟 CosmicSage ${{ needs.validate.outputs.version }}

            ## Highlights
            ${{ github.event.inputs.release-notes || 'See changelog below.' }}

            ${{ needs.changelog.outputs.changelog }}

            ---

            ## Integration Versions
            - **Agora RTC SDK:** 4.22.x
            - **Razorpay Checkout:** v1
            - **React:** 18.3.x
            - **Vite:** 5.3.x

            ## Installation
            ```bash
            # Download and verify
            wget https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/cosmicsage-${{ needs.validate.outputs.version }}.tar.gz
            sha256sum -c cosmicsage-${{ needs.validate.outputs.version }}.sha256
            tar -xzf cosmicsage-${{ needs.validate.outputs.version }}.tar.gz
            ```
          files: |
            cosmicsage-${{ needs.validate.outputs.version }}.tar.gz
            cosmicsage-${{ needs.validate.outputs.version }}.sha256

  # ──────────────────────────────────────────────────────
  # STEP 6: Deploy Release to Production
  # ──────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy Release
    runs-on: ubuntu-latest
    needs: [validate, release]
    environment:
      name: production
      url: https://cosmicsage.app

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.validate.outputs.version }}
          path: dist/

      - name: Deploy to production
        run: |
          echo "Deploying CosmicSage ${{ needs.validate.outputs.version }} to production..."
          # In real world: push to Vercel, AWS S3+CloudFront, etc.

      - name: Tag Docker image (if applicable)
        run: |
          echo "Tagging Docker image cosmicsage:${{ needs.validate.outputs.version }}"
          # docker tag cosmicsage:latest cosmicsage:${{ needs.validate.outputs.version }}
          # docker push cosmicsage:${{ needs.validate.outputs.version }}

      - name: Announce release
        uses: slackapi/slack-github-action@v1.27.0
        if: always()
        with:
          payload: |
            {
              "text": "🌟 CosmicSage *${{ needs.validate.outputs.version }}* released!\nhttps://cosmicsage.app\nSee release notes: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.tag }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
