name: 🚀 CosmicSage Deploy

on:
  push:
    branches:
      - main        # → Production
      - develop     # → Staging
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]
      skip_tests:
        description: 'Skip test suite'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '20.x'

jobs:
  # ──────────────────────────────────────────────────────
  # STEP 1: Determine Target Environment
  # ──────────────────────────────────────────────────────
  setup:
    name: 🎯 Setup Deployment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      deploy-url: ${{ steps.env.outputs.deploy-url }}
      api-url: ${{ steps.env.outputs.api-url }}

    steps:
      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="production"
          else
            ENV="staging"
          fi

          echo "environment=$ENV" >> $GITHUB_OUTPUT

          if [[ "$ENV" == "production" ]]; then
            echo "deploy-url=https://cosmicsage.app" >> $GITHUB_OUTPUT
            echo "api-url=https://api.cosmicsage.app" >> $GITHUB_OUTPUT
          else
            echo "deploy-url=https://staging.cosmicsage.app" >> $GITHUB_OUTPUT
            echo "api-url=https://api-staging.cosmicsage.app" >> $GITHUB_OUTPUT
          fi

          echo "### 🎯 Deployment Target" >> $GITHUB_STEP_SUMMARY
          echo "Environment: **$ENV**" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────
  # STEP 2: Run Tests (unless skipped)
  # ──────────────────────────────────────────────────────
  test:
    name: 🧪 Pre-Deploy Tests
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'npm' }
      - run: npm ci
      - run: npm test
        env:
          VITE_AGORA_APP_ID: ${{ secrets.AGORA_APP_ID_TEST }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_TEST }}

  # ──────────────────────────────────────────────────────
  # STEP 3: Build with Environment Variables
  # ──────────────────────────────────────────────────────
  build:
    name: 📦 Build ${{ needs.setup.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [setup, test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    environment: ${{ needs.setup.outputs.environment }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'npm' }
      - run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          VITE_AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          VITE_API_URL: ${{ needs.setup.outputs.api-url }}
          VITE_ENVIRONMENT: ${{ needs.setup.outputs.environment }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Inject build metadata
        run: |
          cat > dist/build-info.json << EOF
          {
            "version": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "environment": "${{ needs.setup.outputs.environment }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "builtBy": "GitHub Actions"
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ needs.setup.outputs.environment }}-${{ github.sha }}
          path: dist/
          retention-days: 14

  # ──────────────────────────────────────────────────────
  # STEP 4a: Deploy to Staging (Vercel)
  # ──────────────────────────────────────────────────────
  deploy-staging:
    name: 🌙 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: needs.setup.outputs.environment == 'staging'
    environment:
      name: staging
      url: ${{ needs.setup.outputs.deploy-url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-staging-${{ github.sha }}
          path: dist/

      - name: Deploy to Vercel (Staging)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          alias-domains: staging.cosmicsage.app

      - name: Run smoke tests on staging
        run: |
          echo "Running smoke tests against staging..."
          sleep 30  # Wait for deployment to propagate
          curl -f "${{ needs.setup.outputs.deploy-url }}" || exit 1
          echo "✅ Staging deployment verified"

      - name: Notify Slack — Staging
        uses: slackapi/slack-github-action@v1.27.0
        if: always()
        with:
          payload: |
            {
              "text": "🌙 CosmicSage deployed to *Staging*\nCommit: `${{ github.sha }}`\nURL: ${{ needs.setup.outputs.deploy-url }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ──────────────────────────────────────────────────────
  # STEP 4b: Deploy to Production (with approval gate)
  # ──────────────────────────────────────────────────────
  deploy-production:
    name: 🌟 Deploy to Production
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: needs.setup.outputs.environment == 'production'
    environment:
      name: production
      url: ${{ needs.setup.outputs.deploy-url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-production-${{ github.sha }}
          path: dist/

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

      - name: Purge CDN cache
        run: |
          echo "Purging CloudFront CDN cache..."
          # aws cloudfront create-invalidation --distribution-id ${{ secrets.CDN_DISTRIBUTION_ID }} --paths "/*"

      - name: Run production smoke tests
        run: |
          sleep 45
          curl -f "https://cosmicsage.app" || exit 1
          echo "✅ Production deployment verified"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: deploy-${{ github.run_number }}
          release_name: Production Deploy #${{ github.run_number }}
          body: |
            ## 🚀 Production Deployment

            - **Commit:** ${{ github.sha }}
            - **Deployed at:** ${{ github.run_started_at }}
            - **Deployed by:** ${{ github.actor }}

            ### Changes
            ${{ github.event.head_commit.message }}

      - name: Notify Slack — Production
        uses: slackapi/slack-github-action@v1.27.0
        if: always()
        with:
          payload: |
            {
              "text": "🌟 CosmicSage deployed to *Production*!\nVersion: `deploy-${{ github.run_number }}`\nURL: https://cosmicsage.app\nBy: @${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ──────────────────────────────────────────────────────
  # STEP 5: Post-Deploy Monitoring Check
  # ──────────────────────────────────────────────────────
  post-deploy:
    name: 📊 Post-Deploy Checks
    runs-on: ubuntu-latest
    needs: [setup, deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')

    steps:
      - name: Health check
        run: |
          ENV="${{ needs.setup.outputs.environment }}"
          URL="${{ needs.setup.outputs.deploy-url }}"
          echo "Running health checks for $ENV at $URL"

          # Check main page
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed with status $STATUS"
            exit 1
          fi
          echo "✅ Health check passed (HTTP $STATUS)"

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ needs.setup.outputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ needs.setup.outputs.deploy-url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Actor | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
