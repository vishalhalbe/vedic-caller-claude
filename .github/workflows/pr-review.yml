name: 🔍 PR Review Agent

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main, develop]

jobs:
  review:
    name: 🔍 Reviewer Agent — PR #${{ github.event.pull_request.number }}
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: 🔍 Run Reviewer Agent
        env:
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER:         ${{ github.event.pull_request.number }}
        run: node agents/reviewer/review.js

      - name: Check review verdict
        run: |
          echo "PR #${{ github.event.pull_request.number }} reviewed by CosmicSage Reviewer Agent" >> $GITHUB_STEP_SUMMARY
